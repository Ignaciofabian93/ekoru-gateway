services:
  ekoru-gateway:
    image: ekoru-gateway:prod
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    container_name: ekoru-gateway
    env_file:
      - .env.prod
    ports:
      - '4100:4000'
    networks:
      - ekoru-network
    volumes:
      - /home/ekoru/images:/app/images
    deploy:
      resources:
        limits:
          cpus: '2.0' # Maximum 2 CPU cores (gateway is entry point)
          memory: 1024M # Maximum 1GB RAM
        reservations:
          cpus: '0.5' # Minimum 0.5 CPU cores reserved
          memory: 512M # Minimum 512MB RAM reserved
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--quiet',
          '--tries=1',
          '--spider',
          'http://localhost:9000/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ekoru-network:
    external: true
